<!doctype html><meta charset="utf-8"><title>HS-02 Wasm UI preview</title>
<style>body{background:#181a1e;color:#e8edf2;font:14px system-ui;margin:30px auto;max-width:700px}canvas{width:100%;image-rendering:pixelated;border:8px solid #111}label{display:inline-grid;margin:8px}input,select{width:92px}#status{color:#aaa}</style>
<h1>HS-02 UI — real drawing code / Wasm</h1><p id="status">Load this through a web server after running <code>../build.sh</code>.</p>
<canvas id="lcd" width="160" height="80"></canvas><p><label>Firmware page <select id="mode"><option value="0">idle</option><option value="1" selected>solder</option><option value="2">boost</option><option value="3">sleep</option><option value="4">boot (Tip C = progress 0..1000)</option></select></label><label>Tip <select id="fault"><option value="0">ok</option><option value="1">no tip</option><option value="2">shorted</option></select></label><label>Tip C <input id="tip" type="number" value="428"></label><label>Set C <input id="set" type="number" value="430"></label><label>W <input id="watts" type="number" step=".1" value="42.5"></label><label>V <input id="volts" type="number" step=".1" value="20.0"></label></p>
<script type="module">
const rgb565=v=>`rgb(${((v>>11)&31)*255/31|0} ${((v>>5)&63)*255/63|0} ${(v&31)*255/31|0})`, palette=[0x0862,0xF77C,0xFBC5,0x45B8].map(rgb565), c=document.querySelector('#lcd'),g=c.getContext('2d'),$=x=>document.querySelector(x);
try { const factory=(await import('./generated/hs02-ui.mjs')).default, m=await factory(),params=new URLSearchParams(location.search); if(params.has('mode'))$('#mode').value=params.get('mode'); $('#status').textContent='Running production draw_home_gauge.cpp in WebAssembly.';
  function render(){m._hs02_ui_set_state(+$('#tip').value,+$('#set').value,480,Math.round(+$('#watts').value*10),Math.round(+$('#volts').value*10),0,+$('#fault').value);m._hs02_ui_render(+$('#mode').value);let p=m._hs02_ui_rgb565()>>1,d=g.createImageData(160,80),h=new Uint16Array(m.HEAPU8.buffer);for(let i=0;i<160*80;i++){let v=h[p+i],o=i*4;d.data[o]=((v>>11)&31)*255/31;d.data[o+1]=((v>>5)&63)*255/63;d.data[o+2]=(v&31)*255/31;d.data[o+3]=255}g.putImageData(d,0,0)}document.querySelectorAll('input,select').forEach(e=>e.oninput=render);render();
} catch(e) { $('#status').textContent=`Wasm module unavailable: ${e.message}`; }
</script>
